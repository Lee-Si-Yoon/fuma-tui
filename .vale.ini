; Styles path.
StylesPath = .github/styles

; Minimum alert level (suggestion, warning, or error).
MinAlertLevel = suggestion

; Vocabularies.
Vocab = Spelling

; Ignored scopes.
IgnoredScopes = code, text.frontmatter.url

; Formats (treat MDX files as Markdown).
[formats]
mdx = md

; Markdown styles.
[*.{md,mdx}]
BasedOnStyles = Vale

; Comment delimiters (MDX comments).
CommentDelimiters = {/*, */}

; Overrides.
Vale.Spelling = NO
Vale.Terms = NO

; Ignore:
; - import and export statements
; - URLs (including in JSX attribute values)
; - JSX elements, including attribute values
; - inline JSX elements with children
; - URLs and email addresses (avoids brand/spelling false positives in links and domains)
TokenIgnores = \
(?sm)((?:import|export) .+?$), \
(?<!`)(<\w+ ?.+ ?\/>)(?!`), \
(<[A-Z]\w+>.+?<\/[A-Z]\w+>), \
(https?:\/\/[^\s)]+), \
([\w.+-]+@[\w.-]+\.[A-Za-z]{2}[A-Za-z]*)

; Ignore:
; - multi-line self-closing JSX elements
; - multi-line JSX expression containers (a "{" line through a "}" line)
; - multi-line destructured props in an import/export signature (through ") =>")
BlockIgnores = \
(?sm)^(<\w+\n .*\s\/>)$, \
(?sm)^ *\{ *$\n.*?^ *\} *$, \
(?sm)^(?:import|export) [^\n]*\(\{ *$\n.*?^\}\) =>

; Ignore CLAUDE.md and node_modules.
[CLAUDE.md]
BasedOnStyles =

; Obsidian vault: ignore wikilink false positives and attachment paths.
[public/vault/*.md]

; Component showcase — skip Latin lorem ipsum text and demo content.
[public/vault/lorem.md]
BasedOnStyles =
TokenIgnores = \
(\[\[[^\]]+\]\]), \
(\!\[\[[^\]]+\]\])
